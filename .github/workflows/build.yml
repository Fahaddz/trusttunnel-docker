name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      trusttunnel_version:
        description: "TrustTunnel release version without leading v. Empty means latest release."
        required: false
        type: string

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: trusttunnel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve TrustTunnel release
        id: release
        shell: bash
        run: |
          version="${{ github.event.inputs.trusttunnel_version }}"
          if [ -z "$version" ]; then
            version="$(curl -fsSL https://api.github.com/repos/TrustTunnel/TrustTunnel/releases/latest | jq -r .tag_name)"
          fi
          version="${version#v}"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not resolve TrustTunnel release version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            TT_VERSION=${{ steps.release.outputs.version }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:v${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.title=TrustTunnel Endpoint
            org.opencontainers.image.description=Unofficial Docker image for the TrustTunnel endpoint
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
